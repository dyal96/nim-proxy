<div class="chat-layout" id="page-chat">
    <div class="chat-header-bar">
        <div style="display:flex;align-items:center;gap:16px">
            <h1>Chat</h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
            <!-- Quick Model Switcher -->
            <div class="model-switcher" id="model-switcher">
                <button class="model-pill" id="model-pill-btn">
                    <i data-lucide="cpu"></i>
                    <span id="chat-active-model">Loading...</span>
                    <i data-lucide="chevron-down" style="width:14px;height:14px"></i>
                </button>
                <div class="model-dropdown" id="model-dropdown">
                    <input type="text" class="model-search-input" id="quick-model-search" placeholder="Search models..." autocomplete="off">
                    <div class="model-list" id="quick-model-list">
                        <div style="padding:12px;color:var(--text-muted);font-size:13px">Loading models...</div>
                    </div>
                </div>
            </div>
            <button class="btn btn-outline btn-sm" id="chat-clear-btn" title="Clear Chat"><i data-lucide="trash-2"></i></button>
            <button class="btn btn-outline btn-sm" id="chat-history-toggle" title="Chat History"><i data-lucide="history"></i></button>
        </div>
    </div>

    <!-- Chat History Sidebar -->
    <div class="chat-history-panel" id="chat-history-panel">
        <div class="chat-history-header">
            <h3>Chat History</h3>
            <button class="btn btn-outline btn-sm" id="chat-history-close"><i data-lucide="x"></i></button>
        </div>
        <div class="chat-history-list" id="chat-history-list">
            <div class="empty-state" style="padding:24px"><p>No saved chats</p></div>
        </div>
        <button class="btn btn-primary btn-sm" id="new-chat-btn" style="margin:12px;width:calc(100% - 24px)"><i data-lucide="plus"></i> New Chat</button>
    </div>

    <div class="messages-area" id="chat-messages">
        <div class="message assistant">
            <div class="msg-avatar"><i data-lucide="bot"></i></div>
            <div class="msg-content">Hello! I'm your local AI assistant powered by NVIDIA NIM. How can I help you today?</div>
        </div>
    </div>

    <div class="chat-input-area">
        <div class="attachments-bar" id="chat-attachments"></div>
        <form id="chat-form">
            <div class="chat-input-wrapper">
                <div class="chat-actions">
                    <button type="button" class="chat-action-btn" id="btn-attach-file" title="Attach Files"><i data-lucide="paperclip"></i></button>
                    <button type="button" class="chat-action-btn" id="btn-attach-folder" title="Attach Folder"><i data-lucide="folder-plus"></i></button>
                    <input type="file" id="chat-file-input" multiple style="display:none">
                    <input type="file" id="chat-folder-input" webkitdirectory style="display:none">
                </div>
                <textarea id="chat-input" placeholder="Type your message... (Enter to send, Shift+Enter for new line)" rows="1" autocomplete="off"></textarea>
                <button type="submit" id="chat-send" disabled><i data-lucide="send"></i></button>
            </div>
        </form>
        <p class="chat-disclaimer">Powered by NVIDIA NIM Local Proxy</p>
    </div>
</div>
